<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Progressive texture demo</title>
    <style>
      body { margin: 0; font: 13px sans-serif; display: flex; flex-direction: column;
             height: 100vh; }
      #widgets { display: flex; flex: 1; min-height: 0; }
      .panel { flex: 1; display: flex; flex-direction: column; min-width: 0;
               border-right: 1px solid #ccc; }
      .panel:last-child { border-right: none; }
      .panel header { padding: 6px 10px; background: #f3f3f3; border-bottom: 1px solid #ccc; }
      .panel .viewer { flex: 1; min-height: 0; }
      #log { flex: 0 0 11em; margin: 0; padding: 8px 10px; overflow: auto;
             border-top: 1px solid #ccc; background: #111; color: #ddd;
             font: 11px/1.5 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="widgets">
      <section class="panel">
        <header>
          <strong>left</strong> - manifest.json
          <label><input type="checkbox" id="left-annotate" /> annotation mode</label>
        </header>
        <div class="viewer" id="left"></div>
      </section>
      <section class="panel">
        <header>
          <strong>right</strong> - manifest-broken.json
          <label><input type="checkbox" id="right-annotate" /> annotation mode</label>
        </header>
        <div class="viewer" id="right"></div>
      </section>
    </div>
    <pre id="log"></pre>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
